<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة</title>
<link rel="stylesheet" href="style.css?v=15">
</head>
<body data-bg="1" data-pbg="1" data-layout="landscape" data-rot="0">
<!-- #rotator wraps EVERYTHING visual. Unrotated it is a plain full-viewport
     box; in the مدوّر modes it becomes a 100vh×100vw frame rotated ±90° so
     the page itself turns for portrait-mounted panels fed by TV boxes that
     only ever output a landscape signal. -->
<div id="rotator">
<div id="bg"></div>

<main id="stage">
  <!-- Left zone: the five prayer rows -->
  <section id="prayers"></section>

  <!-- Right zone: dates cluster, mosque name, clock, countdowns + sunrise -->
  <section id="rightzone">
    <div id="topcluster">
      <div class="tcol">
        <div class="tline1"><span id="weekday"></span></div>
        <div class="tdate"><span class="num" id="daynum"></span> <span id="monthname"></span></div>
      </div>
      <div class="vdiv"></div>
      <div class="tcol tcol-hijri">
        <div class="thijri" id="hijri"></div>
      </div>
    </div>

    <div id="mosquename">مسجد النور</div>

    <div id="clockwrap"><div id="clock" class="num" title="الإعدادات">00:00:00</div></div>

    <div id="bottomcluster">
      <div class="bcol" id="next-col">
        <div class="blabel" id="next-label">الأذان التالي</div>
        <div class="bname" id="nextname"></div>
        <div class="bval num" id="cd-adhan">--:--</div>
      </div>
      <div class="vdiv"></div>
      <div class="bcol" id="iqama-col">
        <div class="blabel">الإقامة</div>
        <div class="bval num" id="cd-iqama">--:--</div>
      </div>
      <div class="vdiv"></div>
      <div class="bcol">
        <div class="blabel">الشروق</div>
        <div class="bval num" id="sunrise">--:--</div>
      </div>
    </div>
  </section>
</main>

<!-- Iqama-window silent-phone warning: the veil sits UNDER the stage so the
     clock and bottom cluster stay fully visible above it -->
<div id="iqamaveil" hidden></div>
<div id="iqama-alert" hidden role="alert">
  <div class="ia-icon">📵</div>
  <div class="ia-text">يرجى وضع الهاتف على الوضع الصامت</div>
</div>

<div id="toast" role="status"></div>

<button id="gear" title="الإعدادات" aria-label="الإعدادات">⚙</button>

<!-- Settings: a SEPARATE FULL PAGE (not an overlay) built for remote
     control — opening it replaces the main screen entirely; «رجوع» — or
     the remote's Back key, via window.mpsHandleBack — returns. The city
     picker is its own sub-view (#s-city): it opens from the «المدينة»
     row in #s-main, and picking a city closes it straight back here. -->
<section id="panel" hidden aria-label="الإعدادات">
  <div class="s-head">
    <button id="p-close" type="button" aria-label="رجوع">‹ رجوع</button>
    <span class="s-title" id="s-title">الإعدادات</span>
  </div>

  <div id="s-main" class="s-view">
    <div class="s-inner">
      <label class="p-label" for="p-mosque">اسم المسجد</label>
      <textarea id="p-mosque" rows="2" autocomplete="off"></textarea>

      <label class="p-label">اتجاه الشاشة</label>
      <div class="p-layout-row" id="p-layout">
        <button type="button" data-lp="auto">تلقائي</button>
        <button type="button" data-lp="landscape">أفقي</button>
        <button type="button" data-lp="portrait">عمودي</button>
        <button type="button" data-lp="portrait-r">عمودي مدوّر يمينًا</button>
        <button type="button" data-lp="portrait-l">عمودي مدوّر يسارًا</button>
      </div>

      <label class="p-label">المدينة</label>
      <button id="p-city-open" class="s-city-open" type="button">
        <span id="p-city-name"></span>
        <span class="s-city-cta">تغيير المدينة ‹</span>
      </button>

      <div id="p-hijri"></div>

      <div id="p-rows"></div>

      <p class="p-hint">تُحفظ الإعدادات تلقائيًا على هذا الجهاز.</p>
    </div>
  </div>

  <div id="s-city" class="s-view" hidden>
    <div class="s-inner s-city-inner">
      <input id="p-search" type="text" placeholder="ابحث عن مدينة…" autocomplete="off" aria-label="ابحث عن مدينة">
      <div id="p-cities"></div>
    </div>
  </div>
</section>
</div><!-- /#rotator -->

<script src="data.js"></script>
<script src="app.js?v=15"></script>
</body>
</html>
